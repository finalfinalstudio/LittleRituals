<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Wonder timer</title>
  <style>

:root{--bg:#07130f;--panel:#081611;--list:#0d1e18;--line:#284137;--text:#e9efdf;--muted:#b6c2b5;--accent:#97c79b;--accent-dark:#284d37;--button:#13231d}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,select,input{font:inherit}.app{width:min(1420px,calc(100vw - 28px));min-height:min(900px,calc(100vh - 28px));margin:14px auto;border:1px solid var(--line);border-radius:34px;overflow:hidden;display:grid;grid-template-columns:minmax(0,2.1fr) minmax(340px,.92fr);background:rgba(5,17,13,.96)}.stage{padding:42px 36px 30px;min-width:0}.stage-meta{display:flex;align-items:center;justify-content:space-between;margin:0 4px 22px;font-family:Georgia,"Times New Roman",serif;font-size:clamp(19px,1.5vw,25px);line-height:1}.time-display{font-variant-numeric:tabular-nums}.current-ritual{display:flex;align-items:center;gap:9px;color:var(--accent)}.current-ritual img{width:24px;height:24px;filter:invert(82%) sepia(18%) saturate(691%) hue-rotate(70deg)}.visual{position:relative;aspect-ratio:16/9;border:1px solid #30483f;border-radius:27px;overflow:hidden;background:#06100d}.visual video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}.visual #idleVideo{opacity:0;transition:opacity .7s ease}.visual.idle #idleVideo{opacity:1}.visual.idle #mainVideo{opacity:0}.progress-track{height:8px;background:#182b24;border-radius:999px;margin:25px 3px 0;overflow:hidden}.progress-fill{height:100%;width:0;background:var(--accent);border-radius:inherit;transition:width .12s linear}.settings-panel{border-left:1px solid var(--line);padding:42px 34px;display:flex;flex-direction:column;gap:30px;background:var(--panel);transition:width .3s,opacity .25s,padding .3s}.controls{display:flex;gap:12px}.controls button,.presets button{border:1px solid #31483e;background:var(--button);color:var(--text);border-radius:999px;padding:13px 24px;cursor:pointer}.controls .primary,.presets button.active{background:var(--accent);border-color:var(--accent);color:#102016}.setting-block{display:grid;gap:16px}.setting-heading,.setting-row{display:flex;align-items:center;justify-content:space-between;gap:20px;color:var(--muted);font-size:18px}.setting-heading output{color:var(--text)}input[type=range]{width:100%;accent-color:var(--accent);cursor:pointer}.presets{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.presets button{padding:9px 5px;border-radius:14px}.ritual-list{background:var(--list);border:1px solid #263d34;border-radius:19px;overflow:hidden}.ritual-list button{position:relative;width:100%;border:0;border-bottom:1px solid rgba(113,142,127,.17);background:transparent;color:var(--muted);display:flex;align-items:center;gap:10px;padding:12px 18px;text-align:left;cursor:default;font-size:18px}.ritual-list button:last-child{border-bottom:0}.ritual-list button:hover{background:rgba(255,255,255,.035);color:var(--text)}.ritual-list button.selected{background:rgba(151,199,155,.13);color:var(--text)}.icon-slot{width:25px;height:25px;display:grid;place-items:center;flex:0 0 25px}.icon-slot img{width:23px;height:23px;opacity:0;transform:translateX(-5px);transition:opacity .2s,transform .2s;filter:invert(82%) sepia(18%) saturate(691%) hue-rotate(70deg)}.ritual-list button:hover .icon-slot img,.ritual-list button.selected .icon-slot img{opacity:1;transform:translateX(0)}select{appearance:auto;background:var(--button);color:var(--text);border:1px solid #31483e;border-radius:15px;padding:12px 16px;min-width:165px}.switch{appearance:none;width:48px;height:27px;background:#26342f;border:1px solid #465951;border-radius:999px;position:relative;cursor:pointer}.switch:before{content:"";position:absolute;width:19px;height:19px;border-radius:50%;background:#fff;top:3px;left:4px;transition:transform .2s}.switch:checked{background:var(--accent)}.switch:checked:before{transform:translateX(20px)}.settings-fab{display:none;position:absolute;top:18px;right:18px;width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(6,17,13,.75);color:#fff;cursor:pointer;backdrop-filter:blur(8px);font-size:19px}.app.settings-hidden{grid-template-columns:1fr}.app.settings-hidden .settings-panel{display:none}.app.settings-hidden .settings-fab{display:block}
@media(max-width:900px){.app{grid-template-columns:1fr;border-radius:24px}.stage{padding:26px 20px 22px}.settings-panel{border-left:0;border-top:1px solid var(--line);padding:26px 20px}.presets{grid-template-columns:repeat(4,1fr)}.controls button{padding:12px 19px}.stage-meta{font-size:20px}}
@media(max-width:520px){.app{width:100%;margin:0;border-radius:0;border-left:0;border-right:0}.stage{padding:20px 14px}.settings-panel{padding:22px 14px}.visual{border-radius:19px}.controls{display:grid;grid-template-columns:repeat(3,1fr)}.controls button{padding:11px 6px}.setting-heading,.setting-row{font-size:16px}.ritual-list button{font-size:16px}.presets{grid-template-columns:repeat(4,1fr)}}

</style>
</head>
<body>
<main class="app" data-ritual="wonder">
  <section class="stage">
    <header class="stage-meta">
      <div id="timeDisplay" class="time-display">25:00</div>
      <div class="current-ritual"><span>wonder</span><img src="assets/icons/wonder.svg?v=3" alt=""></div>
    </header>

    <div class="visual" aria-label="Wonder animation">
      <video id="mainVideo" muted playsinline preload="auto" src="assets/videos/wonder-main.mp4?v=3"></video>
      <video id="idleVideo" muted playsinline preload="auto" loop src="assets/videos/wonder-idle.mp4?v=3"></video>
      <button id="openSettings" class="settings-fab" type="button" aria-label="Show settings">⚙</button>
    </div>
    <div class="progress-track" aria-hidden="true"><div id="progressFill" class="progress-fill"></div></div>
  </section>

  <aside id="settingsPanel" class="settings-panel">
    <div class="controls">
      <button id="startButton" class="primary" type="button">start</button>
      <button id="pauseButton" type="button">pause</button>
      <button id="resetButton" type="button">reset</button>
    </div>

    <section class="setting-block duration-block">
      <div class="setting-heading"><label for="durationSlider">duration</label><output id="durationOutput">25 min</output></div>
      <input id="durationSlider" type="range" min="1" max="120" step="1" value="25">
      <div class="presets" aria-label="Duration presets">
        <button type="button" data-minutes="5">5</button><button type="button" data-minutes="15">15</button>
        <button type="button" class="active" data-minutes="25">25</button><button type="button" data-minutes="45">45</button>
        <button type="button" data-minutes="60">60</button><button type="button" data-minutes="90">90</button>
        <button type="button" data-minutes="120">120</button>
      </div>
    </section>

    <nav class="ritual-list" aria-label="Rituals">
      <button type="button" aria-disabled="true"><span class="icon-slot"><img src="assets/icons/bloom.svg?v=3" alt=""></span><span>bloom</span></button>
      <button type="button" aria-disabled="true"><span class="icon-slot"><img src="assets/icons/glow.svg?v=3" alt=""></span><span>glow</span></button>
      <button type="button" aria-disabled="true"><span class="icon-slot"><img src="assets/icons/flow.svg?v=3" alt=""></span><span>flow</span></button>
      <button type="button" aria-disabled="true"><span class="icon-slot"><img src="assets/icons/rise.svg?v=3" alt=""></span><span>rise</span></button>
      <button type="button" aria-disabled="true"><span class="icon-slot"><img src="assets/icons/read.svg?v=3" alt=""></span><span>read</span></button>
      <button type="button" aria-disabled="true"><span class="icon-slot"><img src="assets/icons/melt.svg?v=3" alt=""></span><span>melt</span></button>
      <button type="button" aria-disabled="true"><span class="icon-slot"><img src="assets/icons/fall.svg?v=3" alt=""></span><span>fall</span></button>
      <button type="button" aria-disabled="true"><span class="icon-slot"><img src="assets/icons/grow.svg?v=3" alt=""></span><span>grow</span></button>
      <button type="button" class="selected" aria-current="true"><span class="icon-slot"><img src="assets/icons/wonder.svg?v=3" alt=""></span><span>wonder</span></button>
    </nav>

    <div class="setting-row">
      <label for="soundSelect">finish sound</label>
      <select id="soundSelect">
        <option value="none">no sound</option>
        <option value="soft-chime" selected>soft chime</option>
        <option value="glass-bell">glass bell</option>
        <option value="singing-bowl">singing bowl</option>
        <option value="wind-chime">wind chime</option>
        <option value="wood-knock">wood knock</option>
        <option value="forest-bell">forest bell</option>
        <option value="gentle-piano">gentle piano</option>
      </select>
    </div>

    <div class="setting-row">
      <label for="hideSettings">hide settings</label>
      <input id="hideSettings" class="switch" type="checkbox">
    </div>
  </aside>
</main>
<script>

const $=s=>document.querySelector(s);
const app=$('.app'), visual=$('.visual'), mainVideo=$('#mainVideo'), idleVideo=$('#idleVideo');
const display=$('#timeDisplay'), progressFill=$('#progressFill'), slider=$('#durationSlider'), output=$('#durationOutput');
let totalSeconds=25*60, remaining=totalSeconds, running=false, finished=false, startStamp=0, startRemaining=remaining, raf=0, lastSeek=0;

function fmt(sec){sec=Math.max(0,Math.ceil(sec));return `${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`}
function setDuration(minutes){running=false;cancelAnimationFrame(raf);totalSeconds=minutes*60;remaining=totalSeconds;finished=false;visual.classList.remove('idle');idleVideo.pause();idleVideo.currentTime=0;mainVideo.pause();seekMain(0,true);slider.value=minutes;output.value=`${minutes} min`;display.textContent=fmt(remaining);progressFill.style.width='0%';document.querySelectorAll('.presets button').forEach(b=>b.classList.toggle('active',+b.dataset.minutes===minutes));}
function seekMain(progress,force=false){if(!Number.isFinite(mainVideo.duration)||mainVideo.duration<=0)return;const now=performance.now();if(!force&&now-lastSeek<85)return;lastSeek=now;const target=Math.min(Math.max(progress,0),1)*Math.max(0,mainVideo.duration-.025);if(Math.abs(mainVideo.currentTime-target)>.025)mainVideo.currentTime=target;}
function tick(now){if(!running)return;remaining=Math.max(0,startRemaining-(now-startStamp)/1000);const progress=1-remaining/totalSeconds;display.textContent=fmt(remaining);progressFill.style.width=`${progress*100}%`;seekMain(progress);if(remaining<=0){finish();return}raf=requestAnimationFrame(tick)}
function start(){if(finished)setDuration(+slider.value);if(running)return;running=true;startRemaining=remaining;startStamp=performance.now();raf=requestAnimationFrame(tick)}
function pause(){if(!running)return;running=false;cancelAnimationFrame(raf)}
function reset(){setDuration(+slider.value)}
async function finish(){running=false;finished=true;remaining=0;display.textContent='00:00';progressFill.style.width='100%';seekMain(1,true);visual.classList.add('idle');idleVideo.currentTime=0;try{await idleVideo.play()}catch{}playFinishSound($('#soundSelect').value)}
slider.addEventListener('input',()=>setDuration(+slider.value));document.querySelectorAll('.presets button').forEach(b=>b.addEventListener('click',()=>setDuration(+b.dataset.minutes)));
$('#startButton').addEventListener('click',start);$('#pauseButton').addEventListener('click',pause);$('#resetButton').addEventListener('click',reset);
$('#hideSettings').addEventListener('change',e=>app.classList.toggle('settings-hidden',e.target.checked));$('#openSettings').addEventListener('click',()=>{app.classList.remove('settings-hidden');$('#hideSettings').checked=false});
mainVideo.addEventListener('loadedmetadata',()=>seekMain(0,true));mainVideo.muted=true;idleVideo.muted=true;

let audioCtx;
function tone(ctx,freq,start,dur,gain=.12,type='sine'){const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(freq,start);g.gain.setValueAtTime(0,start);g.gain.linearRampToValueAtTime(gain,start+.018);g.gain.exponentialRampToValueAtTime(.0001,start+dur);o.connect(g).connect(ctx.destination);o.start(start);o.stop(start+dur+.03)}
function playFinishSound(name){if(name==='none')return;audioCtx ||= new (window.AudioContext||window.webkitAudioContext)();const c=audioCtx,t=c.currentTime+.03;const map={
 'soft-chime':()=>{tone(c,659,t,1.7,.10);tone(c,988,t+.08,1.8,.055)},
 'glass-bell':()=>{tone(c,1046,t,1.2,.09,'sine');tone(c,1568,t+.03,1.0,.04)},
 'singing-bowl':()=>{tone(c,220,t,2.8,.10);tone(c,440,t+.02,2.4,.035)},
 'wind-chime':()=>{[784,988,1175].forEach((f,i)=>tone(c,f,t+i*.16,1.4,.055))},
 'wood-knock':()=>{tone(c,150,t,.18,.17,'triangle');tone(c,110,t+.08,.20,.09,'triangle')},
 'forest-bell':()=>{tone(c,523,t,2.1,.08);tone(c,784,t+.12,1.8,.04)},
 'gentle-piano':()=>{[261.6,329.6,392].forEach((f,i)=>tone(c,f,t+i*.035,2.2,.045,'triangle'))}
};(map[name]||map['soft-chime'])()}
setDuration(25);

</script>
</body>
</html>
