<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Little Rituals</title>
<style>
:root{
  --bg:#07110e; --panel:#0b1713; --panel-2:#10201a; --text:#edf5e9;
  --muted:#afbeaf; --line:rgba(255,255,255,.11); --accent:#7dd6c8;
  --accent-soft:rgba(125,214,200,.18); --shadow:0 24px 70px rgba(0,0,0,.24);
}
*{box-sizing:border-box} html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:18px;transition:background .45s,color .45s}
button,select,input{font:inherit;color:inherit}.app{max-width:1500px;margin:auto;min-height:calc(100vh - 36px);display:grid;grid-template-columns:minmax(0,2fr) minmax(340px,.9fr);border:1px solid var(--line);border-radius:32px;overflow:hidden;background:color-mix(in srgb,var(--panel) 92%,transparent);box-shadow:var(--shadow)}
.stage{padding:34px;display:flex;flex-direction:column;min-width:0}.topline{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;font-family:Georgia,serif;font-size:clamp(20px,2vw,30px);letter-spacing:.01em}.ritual-title{display:flex;gap:10px;align-items:center}.title-icon{width:30px;height:30px;display:inline-grid;place-items:center}.title-icon svg{width:100%;height:100%}.canvas{position:relative;flex:1;min-height:500px;border:1px solid var(--line);border-radius:28px;overflow:hidden;background:#101512}
.scene{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .35s}.scene.active{opacity:1}.scene svg{width:100%;height:100%;display:block}
.progress{height:8px;margin-top:20px;background:rgba(255,255,255,.10);border-radius:999px;overflow:hidden}.progress>span{display:block;height:100%;width:0;background:var(--accent);border-radius:inherit;transition:width .12s linear}
.controls{padding:34px;border-left:1px solid var(--line);background:color-mix(in srgb,var(--panel) 96%,black 4%);display:flex;flex-direction:column;gap:24px}.control-icons{display:flex;gap:12px}.icon-btn{width:58px;height:50px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.045);display:grid;place-items:center;cursor:pointer;transition:.18s}.icon-btn:hover{background:rgba(255,255,255,.09);transform:translateY(-1px)}.icon-btn:active{transform:scale(.96)}.icon-btn.active{background:var(--accent);color:#102016;border-color:transparent}.icon-btn.dim{opacity:.35}.icon-btn svg{width:22px;height:22px}
.labelrow{display:flex;justify-content:space-between;align-items:center;font-size:15px;color:var(--muted);margin-bottom:12px}.value{color:var(--text)}input[type=range]{width:100%;accent-color:var(--accent)}.presets{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:12px}.preset{border:1px solid var(--line);background:rgba(255,255,255,.045);border-radius:999px;padding:8px 0;cursor:pointer}.preset.active{background:var(--accent);color:#102016;border-color:transparent}
.ritual-list{background:color-mix(in srgb,var(--panel-2) 76%,white 4%);border:1px solid var(--line);border-radius:20px;overflow:hidden}.ritual-option{height:50px;display:flex;align-items:center;gap:12px;padding:0 16px;border:0;border-bottom:1px solid rgba(255,255,255,.07);width:100%;background:transparent;cursor:pointer;text-align:left}.ritual-option:last-child{border-bottom:0}.ritual-option:hover{background:rgba(255,255,255,.055)}.ritual-option.active{background:var(--accent-soft)}.ritual-icon{width:24px;height:24px;opacity:0;transform:translateX(-4px);transition:.18s;flex:0 0 24px}.ritual-option:hover .ritual-icon,.ritual-option.active .ritual-icon{opacity:1;transform:none}.ritual-icon svg{width:100%;height:100%;display:block}
.select-row{display:flex;justify-content:space-between;align-items:center;gap:16px;color:var(--muted)}select{min-width:160px;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:14px;padding:12px 42px 12px 14px}.switch{width:48px;height:28px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.08);position:relative;cursor:pointer}.switch:after{content:"";position:absolute;width:20px;height:20px;border-radius:50%;background:#fff;left:4px;top:3px;transition:.2s}.switch.on{background:var(--accent)}.switch.on:after{left:23px}.settings-hidden .controls{display:none}.settings-hidden .app{grid-template-columns:1fr}.gear{display:none;position:fixed;right:26px;top:24px;width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--text);place-items:center;cursor:pointer}.settings-hidden .gear{display:grid}
@media(max-width:900px){body{padding:0}.app{border-radius:0;grid-template-columns:1fr}.controls{border-left:0;border-top:1px solid var(--line)}.canvas{min-height:420px}.stage,.controls{padding:22px}.presets{grid-template-columns:repeat(4,1fr)}}
@media(max-width:560px){.canvas{min-height:360px}.topline{font-size:20px}.controls{gap:20px}.presets{grid-template-columns:repeat(3,1fr)}}
/* shared scene helpers */
.paper{fill:#f7f0e4}.soft-shadow{filter:drop-shadow(0 10px 18px rgba(0,0,0,.18))}.grow-stroke{stroke-dasharray:1;stroke-dashoffset:1}.idle{transform-box:fill-box;transform-origin:center}.scene.idling .idle{animation:sway 4s ease-in-out infinite alternate}.scene.idling .twinkle{animation:twinkle 2.8s ease-in-out infinite}.scene.idling .float{animation:float 4.2s ease-in-out infinite alternate}.scene.idling .flicker{animation:flicker 1.7s ease-in-out infinite alternate}@keyframes sway{to{transform:rotate(1.3deg)}}@keyframes twinkle{50%{opacity:.25;transform:scale(.72)}}@keyframes float{to{transform:translate(8px,-10px)}}@keyframes flicker{to{opacity:.72;transform:scale(.96)}}
</style>
</head>
<body>
<button class="gear" id="gear" aria-label="Show settings">⚙</button>
<div class="app">
  <main class="stage">
    <div class="topline"><span id="timeDisplay">25:00</span><span class="ritual-title"><span id="ritualName">wonder</span><span class="title-icon" id="titleIcon"></span></span></div>
    <div class="canvas" id="canvas"></div>
    <div class="progress"><span id="progressFill"></span></div>
  </main>
  <aside class="controls">
    <div class="control-icons">
      <button class="icon-btn active" id="startBtn" aria-label="Start"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M8 5v14l11-7z"/></svg></button>
      <button class="icon-btn" id="pauseBtn" aria-label="Pause"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M7 5h4v14H7zm6 0h4v14h-4z"/></svg></button>
      <button class="icon-btn dim" id="resetBtn" aria-label="Reset"><svg viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" d="M4 4v6h6M5.5 9a7 7 0 1 1-.4 6"/></svg></button>
    </div>
    <section>
      <div class="labelrow"><span>duration</span><span class="value" id="durationValue">25 min</span></div>
      <input id="durationSlider" type="range" min="1" max="120" value="25" />
      <div class="presets" id="presets"></div>
    </section>
    <div class="ritual-list" id="ritualList"></div>
    <div class="select-row"><span>finish sound</span><select id="soundSelect"><option value="none">no sound</option><option value="soft">soft chime</option><option value="glass">glass bell</option><option value="bowl">singing bowl</option><option value="wind">wind chime</option><option value="wood">wood knock</option></select></div>
    <div class="select-row"><span>hide settings</span><button class="switch" id="hideSwitch" aria-label="Hide settings"></button></div>
  </aside>
</div>

createScenes();
let current='wonder',duration=25*60,remaining=duration,running=false,last=0,raf=null,finished=false;
const timeDisplay=document.getElementById('timeDisplay'),progressFill=document.getElementById('progressFill'),ritualName=document.getElementById('ritualName'),titleIcon=document.getElementById('titleIcon');
function applyTheme(id){const t=THEMES[id];for(const [k,v] of Object.entries(t)){document.documentElement.style.setProperty(`--${k==='panel2'?'panel-2':k==='soft'?'accent-soft':k}`,v)}ritualName.textContent=id;titleIcon.innerHTML=ICONS[id];document.querySelectorAll('.scene').forEach(s=>s.classList.toggle('active',s.dataset.scene===id));document.querySelectorAll('.ritual-option').forEach(b=>b.classList.toggle('active',b.dataset.id===id));updateScene(progress())}
function progress(){return duration?Math.min(1,Math.max(0,1-remaining/duration)):0}
function fade(el,a,b,p){if(!el)return;el.style.opacity=p<=a?0:p>=b?1:(p-a)/(b-a)}
function scale(el,a,b,p,from=.15,to=1){if(!el)return;const x=p<=a?from:p>=b?to:from+(to-from)*(p-a)/(b-a);el.style.transformBox='fill-box';el.style.transformOrigin='center bottom';el.style.transform=`scale(${x})`}
function updateScene(p){
 const s=document.querySelector(`.scene[data-scene="${current}"]`);if(!s)return;
 s.classList.toggle('idling',!running && (finished||p>0));
 if(current==='bloom'){scale(s.querySelector('#b-root'),0,.12,p,0,1);scale(s.querySelector('#b-plant'),.08,.7,p,0.03,1);scale(s.querySelector('#b-flower'),.68,1,p,0.05,1)}
 if(current==='glow'){const c=s.querySelector('#g-candle');const h=280*(1-p*.65),y=185+280-h;c.setAttribute('height',h);c.setAttribute('y',y);s.querySelector('#g-wax').style.transform=`translateY(${280-h}px)`;s.querySelector('#g-flame').style.transform=`translateY(${280-h}px)`;s.querySelector('#g-glow').style.transform=`translateY(${280-h}px)`}
 if(current==='flow'){const top=s.querySelector('#f-topSand'),bottom=s.querySelector('#f-bottomSand'),stream=s.querySelector('#f-stream');top.style.transformOrigin='170px 70px';top.style.transform=`scaleY(${1-p})`;bottom.style.transformOrigin='170px 420px';bottom.style.transform=`scaleY(${Math.max(.05,p)})`;stream.style.opacity=p>0&&p<1?1:0}
 if(current==='rise'){const sun=s.querySelector('#r-sun'),rays=s.querySelector('#r-rays');const x=170+560*p,y=430-260*Math.sin(Math.PI*p);sun.setAttribute('cx',x);sun.setAttribute('cy',y);rays.style.transform=`translate(${x-170}px,${y-430}px)`;rays.style.opacity=Math.min(1,p*2)}
 if(current==='read'){['book4','book3','book2','book1'].forEach((id,i)=>{const start=i*.22,end=start+.2,el=s.querySelector('#'+id);let q=p<=start?0:p>=end?1:(p-start)/(end-start);el.style.transform=`translate(${q*360}px,${-q*80}px) rotate(${q*12}deg)`;el.style.opacity=1-q})}
 if(current==='melt'){const ice=s.querySelector('#m-ice'),puddle=s.querySelector('#m-puddle'),drop=s.querySelector('#m-drop');ice.style.transformOrigin='450px 440px';ice.style.transform=`scale(${1-p*.72}) translateY(${p*45}px)`;puddle.setAttribute('rx',70+150*p);puddle.setAttribute('ry',18+20*p);drop.style.opacity=p>.55?1:0}
 if(current==='fall'){const leaves=[...s.querySelectorAll('#fall-leaves circle')];leaves.forEach((el,i)=>{const start=i/leaves.length*.8;let q=Math.max(0,Math.min(1,(p-start)/.18));el.style.transform=`translate(${(i%2?1:-1)*q*50}px,${q*300}px) rotate(${q*180}deg)`;el.style.opacity=1-q});fade(s.querySelector('#falling-leaves'),.15,.85,p)}
 if(current==='grow'){const path=s.querySelector('#v-main');path.style.strokeDasharray=path.getTotalLength();path.style.strokeDashoffset=path.getTotalLength()*(1-p);fade(s.querySelector('#v-leaves'),.25,.65,p);fade(s.querySelector('#v-flowers'),.7,.9,p);fade(s.querySelector('#v-lights'),.9,1,p)}
 if(current==='wonder'){fade(s.querySelector('#w-moss'),.02,.22,p);scale(s.querySelector('#w-ferns'),.18,.42,p,0.05,1);scale(s.querySelector('#w-mush'),.35,.55,p,0.05,1);const vine=s.querySelector('#w-vines');fade(vine,.48,.78,p);scale(vine,.48,.78,p,.05,1);fade(s.querySelector('#w-flowers'),.72,.9,p);scale(s.querySelector('#w-pot'),.78,.94,p,.08,1);fade(s.querySelector('#w-light'),.95,1,p);fade(s.querySelector('#w-fireflies'),.97,1,p)}
}
function format(sec){sec=Math.max(0,Math.ceil(sec));return `${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`}
function render(){timeDisplay.textContent=format(remaining);progressFill.style.width=`${progress()*100}%`;updateScene(progress())}
function tick(ts){if(!running)return;if(!last)last=ts;remaining-=Math.min((ts-last)/1000,1);last=ts;if(remaining<=0){remaining=0;running=false;finished=true;finishSound();setButtons();render();return}render();raf=requestAnimationFrame(tick)}
function setButtons(){document.getElementById('startBtn').classList.toggle('active',!running);document.getElementById('pauseBtn').classList.toggle('active',running);document.getElementById('resetBtn').classList.toggle('dim',remaining===duration&&!running)}
document.getElementById('startBtn').onclick=()=>{if(remaining<=0){remaining=duration;finished=false}running=true;last=0;setButtons();raf=requestAnimationFrame(tick)};
document.getElementById('pauseBtn').onclick=()=>{running=false;cancelAnimationFrame(raf);setButtons();render()};
document.getElementById('resetBtn').onclick=()=>{running=false;cancelAnimationFrame(raf);remaining=duration;finished=false;last=0;setButtons();render()};
const slider=document.getElementById('durationSlider'),durationValue=document.getElementById('durationValue');slider.oninput=()=>setDuration(+slider.value);function setDuration(min){duration=min*60;remaining=duration;running=false;finished=false;durationValue.textContent=`${min} min`;slider.value=min;document.querySelectorAll('.preset').forEach(b=>b.classList.toggle('active',+b.dataset.min===min));setButtons();render()}
[5,15,25,45,60,90,120].forEach(n=>{const b=document.createElement('button');b.className='preset'+(n===25?' active':'');b.dataset.min=n;b.textContent=n;b.onclick=()=>setDuration(n);document.getElementById('presets').appendChild(b)});
rituals.forEach(id=>{const b=document.createElement('button');b.className='ritual-option'+(id===current?' active':'');b.dataset.id=id;b.innerHTML=`<span class="ritual-icon">${ICONS[id]}</span><span>${id}</span>`;b.onclick=()=>{current=id;applyTheme(id)};document.getElementById('ritualList').appendChild(b)});
document.getElementById('hideSwitch').onclick=()=>{document.body.classList.add('settings-hidden');document.getElementById('hideSwitch').classList.add('on')};document.getElementById('gear').onclick=()=>{document.body.classList.remove('settings-hidden');document.getElementById('hideSwitch').classList.remove('on')};
function finishSound(){const type=document.getElementById('soundSelect').value;if(type==='none')return;const C=window.AudioContext||window.webkitAudioContext,ctx=new C(),o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=type==='glass'?880:type==='bowl'?330:type==='wind'?660:type==='wood'?220:523.25;g.gain.setValueAtTime(.001,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.18,ctx.currentTime+.02);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+1.4);o.start();o.stop(ctx.currentTime+1.5)}
applyTheme(current);render();setButtons();
