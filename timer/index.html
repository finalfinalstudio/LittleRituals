<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>little rituals — focus timer</title>
  <link rel="stylesheet" href="style.css?v=11">
</head>
<body>
  <main class="app">
    <section class="scene-panel">
      <div class="topline">
        <div id="timer" class="timer">25:00</div>
        <div class="top-controls">
          <button id="startBtn">▶ <span>start</span></button>
          <button id="pauseBtn">Ⅱ <span>pause</span></button>
          <button id="resetBtn">↻ <span>reset</span></button>
        </div>
      </div>

      <div class="scene">
        <img id="sceneFrame" src="assets/growing-flower/01.webp" alt="growing flower illustration">
      </div>

      <div class="progress">
        <div class="track"><div id="bar" class="bar"></div></div>
        <div class="progress-meta">
          <span id="percent">0%</span>
          <span id="left">25:00 left</span>
        </div>
      </div>

      <button id="showSettings" class="gear hidden" aria-label="show settings">⚙</button>
    </section>

    <aside id="settings" class="settings">
      <div class="field">
        <label>duration</label>
        <div class="duration">
          <input id="hours" type="number" min="0" max="23" value="0"><span>h</span>
          <input id="minutes" type="number" min="0" max="59" value="25"><span>m</span>
          <input id="seconds" type="number" min="0" max="59" value="0"><span>s</span>
        </div>
      </div>

      <div class="field">
        <label for="animation">animation</label>
        <select id="animation">
          <option value="growing-flower">growing flower</option>
        </select>
      </div>

      <div class="row">
        <span>finish sound</span>
        <label class="switch"><input id="sound" type="checkbox" checked><i></i></label>
      </div>

      <div class="row">
        <span>hide settings</span>
        <label class="switch"><input id="hideSettings" type="checkbox"><i></i></label>
      </div>

      <div class="row">
        <span>background</span>
        <label class="color-dot"><input id="background" type="color" value="#f7efdc"></label>
      </div>
    </aside>
  </main>

  <div id="doneModal" class="modal hidden">
    <div class="modal-card">
      <strong>done ✨</strong>
      <button id="restartBtn">restart</button>
    </div>
  </div>

  <script src="script.js?v=11"></script>
</body>
</html>
