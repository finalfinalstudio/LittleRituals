<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>focus timer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <section class="left-column">
      <div class="top-controls" aria-label="timer controls">
        <button id="startBtn" class="primary">start</button>
        <button id="pauseBtn">pause</button>
        <button id="resetBtn">reset</button>
      </div>

      <div class="timer-display" id="timerDisplay">25:00</div>

      <div class="animation-stage" id="animationStage" aria-live="polite">
        <div id="animationMount"></div>
      </div>

      <div class="progress-wrap">
        <div class="progress-track">
          <div id="progressBar" class="progress-bar"></div>
        </div>
        <div class="progress-meta">
          <span id="progressPercent">0%</span>
          <span id="remainingLabel">25:00 left</span>
        </div>
      </div>
    </section>

    <aside class="settings-panel">
      <h1>focus timer</h1>

      <label class="field-label">duration</label>
      <div class="duration-row">
        <input id="hoursInput" type="number" min="0" max="23" value="0" aria-label="hours" />
        <span>h</span>
        <input id="minutesInput" type="number" min="0" max="59" value="25" aria-label="minutes" />
        <span>m</span>
        <input id="secondsInput" type="number" min="0" max="59" value="0" aria-label="seconds" />
        <span>s</span>
      </div>

      <label class="field-label" for="animationSelect">animation</label>
      <select id="animationSelect">
        <option value="jar">filling jar</option>
      </select>

      <label class="field-label" for="backgroundInput">background</label>
      <div class="color-row">
        <input id="backgroundInput" type="color" value="#ffffff" />
        <span id="backgroundValue">#ffffff</span>
      </div>

      <div class="setting-row">
        <span>theme</span>
        <button id="themeBtn">dark mode</button>
      </div>

      <div class="setting-row">
        <span>minimal mode</span>
        <button id="minimalBtn">off</button>
      </div>

      <label class="checkbox-row">
        <input id="soundToggle" type="checkbox" checked />
        <span>finish sound</span>
      </label>

      <p id="statusText" class="status-text">ready</p>
    </aside>
  </main>

  <div id="doneOverlay" class="done-overlay" hidden>
    <div class="done-card">
      <strong>done ✨</strong>
      <button id="closeDoneBtn">restart</button>
    </div>
  </div>

  <script src="animations.js"></script>
  <script src="script.js"></script>
</body>
</html>
