<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f7f1e7" />
  <title>little rituals · focus timer</title>
  <link rel="stylesheet" href="style.css?v=10" />
</head>
<body>
  <main class="app" id="app">
    <section class="scene-column">
      <div class="scene-header">
        <div class="timer-display" id="timerDisplay">25:00</div>
        <button class="gear-button" id="showSettingsBtn" aria-label="show settings" title="show settings" hidden>⚙</button>
      </div>

      <div class="animation-stage" id="animationStage">
        <div id="animationMount" class="animation-mount" aria-live="polite"></div>
      </div>

      <div class="progress-wrap">
        <div class="progress-track" aria-hidden="true">
          <div id="progressBar" class="progress-bar"></div>
        </div>
        <div class="progress-meta">
          <span id="progressPercent">0%</span>
          <span id="remainingLabel">25:00 left</span>
        </div>
      </div>
    </section>

    <aside class="settings-panel" id="settingsPanel">
      <div class="control-row" aria-label="timer controls">
        <button id="startBtn" class="icon-button primary" aria-label="start" title="start">▶</button>
        <button id="pauseBtn" class="icon-button" aria-label="pause" title="pause">Ⅱ</button>
        <button id="resetBtn" class="icon-button" aria-label="reset" title="reset">↻</button>
      </div>

      <div class="settings-group">
        <label class="field-label">duration</label>
        <div class="duration-row">
          <input id="hoursInput" type="number" min="0" max="23" value="0" aria-label="hours" />
          <span>h</span>
          <input id="minutesInput" type="number" min="0" max="59" value="25" aria-label="minutes" />
          <span>m</span>
          <input id="secondsInput" type="number" min="0" max="59" value="0" aria-label="seconds" />
          <span>s</span>
        </div>
      </div>

      <div class="settings-group">
        <label class="field-label" for="animationSelect">animation</label>
        <select id="animationSelect">
          <option value="jar">filling jar</option>
          <option value="ice">melting ice</option>
          <option value="candle">burning candle</option>
          <option value="flower">growing flower</option>
          <option value="hourglass">hourglass</option>
          <option value="sunrise">sunrise</option>
          <option value="books">book stack</option>
          <option value="autumn">autumn tree</option>
          <option value="vine">enchanted vine</option>
          <option value="fairy">fairy garden</option>
        </select>
      </div>

      <label class="setting-row" for="soundToggle">
        <span>finish sound</span>
        <span class="switch">
          <input id="soundToggle" type="checkbox" checked />
          <span class="switch-track"></span>
        </span>
      </label>

      <label class="setting-row" for="hideSettingsToggle">
        <span>hide settings</span>
        <span class="switch">
          <input id="hideSettingsToggle" type="checkbox" />
          <span class="switch-track"></span>
        </span>
      </label>

      <label class="setting-row background-row" for="backgroundInput">
        <span>background</span>
        <span class="color-button" id="colorButton">
          <input id="backgroundInput" type="color" value="#f7f1e7" aria-label="background color" />
        </span>
      </label>
    </aside>
  </main>

  <div id="doneOverlay" class="done-overlay" hidden>
    <div class="done-card" role="dialog" aria-modal="true" aria-labelledby="doneTitle">
      <strong id="doneTitle">done ✨</strong>
      <button id="restartDoneBtn" class="restart-button">restart</button>
    </div>
  </div>

  <script src="animations.js?v=10"></script>
  <script src="script.js?v=10"></script>
</body>
</html>
