<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Wonder timer</title>
  <style>

:root{--bg:#07130f;--panel:#081611;--list:#0d1e18;--line:#284137;--text:#e9efdf;--muted:#b6c2b5;--accent:#97c79b;--accent-dark:#284d37;--button:#13231d}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,select,input{font:inherit}.app{width:min(1420px,calc(100vw - 28px));min-height:min(900px,calc(100vh - 28px));margin:14px auto;border:1px solid var(--line);border-radius:34px;overflow:hidden;display:grid;grid-template-columns:minmax(0,2.1fr) minmax(340px,.92fr);background:rgba(5,17,13,.96)}.stage{padding:42px 36px 30px;min-width:0}.stage-meta{display:flex;align-items:center;justify-content:space-between;margin:0 4px 22px;font-family:Georgia,"Times New Roman",serif;font-size:clamp(19px,1.5vw,25px);line-height:1}.time-display{font-variant-numeric:tabular-nums}.current-ritual{display:flex;align-items:center;gap:9px;color:var(--accent)}.current-ritual img{width:24px;height:24px;filter:invert(82%) sepia(18%) saturate(691%) hue-rotate(70deg)}.visual{position:relative;aspect-ratio:16/9;border:1px solid #30483f;border-radius:27px;overflow:hidden;background:#06100d}.visual video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}.visual #idleVideo{opacity:0;transition:opacity .7s ease}.visual.idle #idleVideo{opacity:1}.visual.idle #mainVideo{opacity:0}.progress-track{height:8px;background:#182b24;border-radius:999px;margin:25px 3px 0;overflow:hidden}.progress-fill{height:100%;width:0;background:var(--accent);border-radius:inherit;transition:width .12s linear}.settings-panel{border-left:1px solid var(--line);padding:42px 34px;display:flex;flex-direction:column;gap:30px;background:var(--panel);transition:width .3s,opacity .25s,padding .3s}.controls{display:flex;gap:12px}.controls button,.presets button{border:1px solid #31483e;background:var(--button);color:var(--text);border-radius:999px;padding:13px 24px;cursor:pointer}.controls .primary,.presets button.active{background:var(--accent);border-color:var(--accent);color:#102016}.setting-block{display:grid;gap:16px}.setting-heading,.setting-row{display:flex;align-items:center;justify-content:space-between;gap:20px;color:var(--muted);font-size:18px}.setting-heading output{color:var(--text)}input[type=range]{width:100%;accent-color:var(--accent);cursor:pointer}.presets{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.presets button{padding:9px 5px;border-radius:14px}.ritual-list{background:var(--list);border:1px solid #263d34;border-radius:19px;overflow:hidden}.ritual-list button{position:relative;width:100%;border:0;border-bottom:1px solid rgba(113,142,127,.17);background:transparent;color:var(--muted);display:flex;align-items:center;gap:10px;padding:12px 18px;text-align:left;cursor:default;font-size:18px}.ritual-list button:last-child{border-bottom:0}.ritual-list button:hover{background:rgba(255,255,255,.035);color:var(--text)}.ritual-list button.selected{background:rgba(151,199,155,.13);color:var(--text)}.icon-slot{width:25px;height:25px;display:grid;place-items:center;flex:0 0 25px}.icon-slot img{width:23px;height:23px;opacity:0;transform:translateX(-5px);transition:opacity .2s,transform .2s;filter:invert(82%) sepia(18%) saturate(691%) hue-rotate(70deg)}.ritual-list button:hover .icon-slot img,.ritual-list button.selected .icon-slot img{opacity:1;transform:translateX(0)}select{appearance:auto;background:var(--button);color:var(--text);border:1px solid #31483e;border-radius:15px;padding:12px 16px;min-width:165px}.switch{appearance:none;width:48px;height:27px;background:#26342f;border:1px solid #465951;border-radius:999px;position:relative;cursor:pointer}.switch:before{content:"";position:absolute;width:19px;height:19px;border-radius:50%;background:#fff;top:3px;left:4px;transition:transform .2s}.switch:checked{background:var(--accent)}.switch:checked:before{transform:translateX(20px)}.settings-fab{display:none;position:absolute;top:18px;right:18px;width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(6,17,13,.75);color:#fff;cursor:pointer;backdrop-filter:blur(8px);font-size:19px}.app.settings-hidden{grid-template-columns:1fr}.app.settings-hidden .settings-panel{display:none}.app.settings-hidden .settings-fab{display:block}
@media(max-width:900px){.app{grid-template-columns:1fr;border-radius:24px}.stage{padding:26px 20px 22px}.settings-panel{border-left:0;border-top:1px solid var(--line);padding:26px 20px}.presets{grid-template-columns:repeat(4,1fr)}.controls button{padding:12px 19px}.stage-meta{font-size:20px}}
@media(max-width:520px){.app{width:100%;margin:0;border-radius:0;border-left:0;border-right:0}.stage{padding:20px 14px}.settings-panel{padding:22px 14px}.visual{border-radius:19px}.controls{display:grid;grid-template-columns:repeat(3,1fr)}.controls button{padding:11px 6px}.setting-heading,.setting-row{font-size:16px}.ritual-list button{font-size:16px}.presets{grid-template-columns:repeat(4,1fr)}}


.visual{display:flex;align-items:center;justify-content:center}
.visual svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.growth-layer{opacity:0;transform-box:fill-box;transform-origin:center bottom}
.moss-layer{transform:scale(.88)}
.mushroom-layer,.fern-layer,.flower-layer,.pot-plant-layer{transform:translateY(16px) scale(.82)}
.vine-layer{transform-origin:center bottom;transform:scaleY(.1)}
.light-layer{mix-blend-mode:screen}.firefly-layer{opacity:0}
.visual.idle .fern-layer,.visual.idle .vine-layer,.visual.idle .flower-layer,.visual.idle .pot-plant-layer{animation:breathe 5.5s ease-in-out infinite}
.visual.idle .light-layer{animation:lantern 3.4s ease-in-out infinite}
.visual.idle .firefly{animation:drift 4s ease-in-out infinite alternate}
.visual.idle .f2{animation-delay:-1.1s}.visual.idle .f3{animation-delay:-2.4s}.visual.idle .f4{animation-delay:-.5s}.visual.idle .f5{animation-delay:-3s}.visual.idle .f6{animation-delay:-1.8s}
@keyframes breathe{0%,100%{translate:0 0;rotate:-.25deg}50%{translate:0 -2px;rotate:.25deg}}
@keyframes lantern{0%,100%{opacity:.72}50%{opacity:1}}
@keyframes drift{from{transform:translate(-4px,3px);opacity:.35}to{transform:translate(5px,-7px);opacity:1}}
.controls button{width:50px;height:50px;padding:0;display:grid;place-items:center;border-radius:50%}
.controls button svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.controls button.primary{background:var(--accent);border-color:var(--accent);color:#102016}
.controls button.active{background:var(--accent);border-color:var(--accent);color:#102016}
.controls button.reset-muted{opacity:.38}
.controls button.reset-ready{opacity:.78}
.controls button:hover{transform:translateY(-1px)}
.controls button:active{transform:scale(.97)}

</style>
</head>
<body>
<main class="app" data-ritual="wonder">
  <section class="stage">
    <header class="stage-meta">
      <div id="timeDisplay" class="time-display">25:00</div>
      <div class="current-ritual"><span>wonder</span><img src="assets/icons/wonder.svg?v=3" alt=""></div>
    </header>

    <div class="visual idle" aria-label="Wonder animation">
<svg id="gardenScene" viewBox="0 0 1200 760" role="img" aria-label="A watercolor garden growing around an old door">
          <defs>
            <linearGradient id="paperWash" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#d9d1bd"/>
              <stop offset="0.5" stop-color="#b6b59e"/>
              <stop offset="1" stop-color="#8e9b82"/>
            </linearGradient>
            <linearGradient id="doorPaint" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#355b59"/>
              <stop offset="1" stop-color="#173735"/>
            </linearGradient>
            <radialGradient id="lanternGlow">
              <stop offset="0" stop-color="#fff5b8" stop-opacity=".95"/>
              <stop offset=".35" stop-color="#e8c96c" stop-opacity=".5"/>
              <stop offset="1" stop-color="#e8c96c" stop-opacity="0"/>
            </radialGradient>
            <filter id="watercolor" x="-15%" y="-15%" width="130%" height="130%">
              <feTurbulence type="fractalNoise" baseFrequency="0.012 0.04" numOctaves="2" seed="8" result="noise"/>
              <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="B"/>
            </filter>
            <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
              <feGaussianBlur stdDeviation="8" result="blur"/>
              <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
            <clipPath id="doorClip"><path d="M458 508V296c0-129 284-129 284 0v212z"/></clipPath>
          </defs>

          <!-- fixed illustrated base -->
          <rect width="1200" height="760" fill="#0b1916"/>
          <rect x="28" y="28" width="1144" height="704" rx="32" fill="url(#paperWash)"/>
          <g filter="url(#watercolor)">
            <path d="M70 560C178 481 250 502 338 472c72-25 126-39 188-15 101 39 175 27 265 3 114-30 209-5 338 85v155H70z" fill="#6f725f" opacity=".92"/>
            <path d="M80 545c106-47 184-49 274-28 111 26 176 9 270-3 124-15 269 6 488 86" fill="none" stroke="#a6a48b" stroke-width="64" stroke-linecap="round" opacity=".55"/>
            <path d="M238 560c145-41 287-58 413-18 103 32 197 29 324-2" fill="none" stroke="#d4c9aa" stroke-width="104" stroke-linecap="round" opacity=".55"/>
            <g fill="#77796d" stroke="#515b54" stroke-width="5" opacity=".96">
              <path d="M392 190h416v375H392z" fill="#84877d"/>
              <path d="M423 510V291c0-167 354-167 354 0v219z" fill="#52605b"/>
            </g>
            <g fill="#9a998a" stroke="#646c63" stroke-width="5">
              <path d="M390 190h420v46H390z"/>
              <path d="M390 235h45v333h-45zM765 235h45v333h-45z"/>
              <path d="M412 231c45-125 333-125 376 0l-44 12c-30-93-270-93-300 0z"/>
            </g>
            <path d="M458 508V296c0-129 284-129 284 0v212z" fill="url(#doorPaint)" stroke="#183431" stroke-width="8"/>
            <g clip-path="url(#doorClip)" stroke="#71908a" stroke-width="4" opacity=".45">
              <path d="M500 220v310M545 205v325M590 190v340M635 190v340M680 205v325"/>
            </g>
            <circle cx="693" cy="401" r="13" fill="none" stroke="#b2a172" stroke-width="7"/>
            <path d="M180 516c-17-111 17-225 92-337M237 517c13-116 2-215-25-312" fill="none" stroke="#4b4637" stroke-width="18" stroke-linecap="round"/>
            <g id="lanternFixture" transform="translate(250 226)">
              <path d="M0 0h105" stroke="#3a3b34" stroke-width="12" stroke-linecap="round"/>
              <path d="M90 0v62" stroke="#3a3b34" stroke-width="10"/>
              <path d="M55 4c12 25 23 25 35 0" fill="none" stroke="#3a3b34" stroke-width="9"/>
              <path d="M54 63h72l-10 106H65z" fill="#263b39" stroke="#252d2b" stroke-width="8"/>
              <path d="M71 81h38v64H72z" fill="#ccd0bd" opacity=".2"/>
            </g>
            <path d="M852 528v-86c0-26 135-26 135 0v86z" fill="#9e7656" stroke="#644b39" stroke-width="7"/>
            <ellipse cx="919" cy="441" rx="69" ry="22" fill="#b98c65" stroke="#644b39" stroke-width="7"/>
            <ellipse cx="919" cy="443" rx="53" ry="13" fill="#423a2d"/>
          </g>

          <!-- progress-controlled garden layers -->
          <g id="mossLayer" class="growth-layer moss-layer">
            <g fill="#52684c" opacity=".95" filter="url(#watercolor)">
              <ellipse cx="250" cy="568" rx="135" ry="42"/><ellipse cx="420" cy="570" rx="120" ry="36"/>
              <ellipse cx="765" cy="563" rx="112" ry="38"/><ellipse cx="963" cy="571" rx="130" ry="40"/>
              <ellipse cx="518" cy="625" rx="140" ry="38"/><ellipse cx="696" cy="625" rx="126" ry="34"/>
            </g>
          </g>

          <g id="mushroomLayer" class="growth-layer mushroom-layer" filter="url(#watercolor)">
            <g transform="translate(298 548)"><path d="M0 36c2-24 27-24 29 0" fill="#d3bd94"/><path d="M-17 16c5-25 58-25 64 0z" fill="#8b684d"/></g>
            <g transform="translate(840 555) scale(.8)"><path d="M0 36c2-24 27-24 29 0" fill="#d3bd94"/><path d="M-17 16c5-25 58-25 64 0z" fill="#7c5b46"/></g>
            <g transform="translate(1010 592) scale(.55)"><path d="M0 36c2-24 27-24 29 0" fill="#d3bd94"/><path d="M-17 16c5-25 58-25 64 0z" fill="#9a6e50"/></g>
          </g>

          <g id="fernLayer" class="growth-layer fern-layer" fill="none" stroke="#486a4f" stroke-linecap="round" filter="url(#watercolor)">
            <g transform="translate(352 583)"><path d="M0 55Q8 2 33-38" stroke-width="8"/><path d="M12 27l-30-22M18 13l32-25M24-3L0-28M30-19l30-11" stroke-width="12"/></g>
            <g transform="translate(792 590) scale(1.2)"><path d="M0 55Q8 2 33-38" stroke-width="8"/><path d="M12 27l-30-22M18 13l32-25M24-3L0-28M30-19l30-11" stroke-width="12"/></g>
            <g transform="translate(925 579) scale(.9)"><path d="M0 55Q8 2 33-38" stroke-width="8"/><path d="M12 27l-30-22M18 13l32-25M24-3L0-28M30-19l30-11" stroke-width="12"/></g>
          </g>

          <g id="vineLayer" class="growth-layer vine-layer" fill="none" stroke="#53714d" stroke-linecap="round" filter="url(#watercolor)">
            <path d="M421 540C368 452 446 408 404 324c-27-53 2-104 45-134" stroke-width="13"/>
            <path d="M782 540c77-80-6-139 51-215 31-42 22-90-12-132" stroke-width="13"/>
            <g fill="#66865d" stroke="none">
              <ellipse cx="408" cy="462" rx="20" ry="9" transform="rotate(-35 408 462)"/><ellipse cx="443" cy="407" rx="22" ry="10" transform="rotate(30 443 407)"/>
              <ellipse cx="404" cy="348" rx="21" ry="9" transform="rotate(-30 404 348)"/><ellipse cx="433" cy="284" rx="20" ry="9" transform="rotate(24 433 284)"/>
              <ellipse cx="806" cy="456" rx="21" ry="9" transform="rotate(28 806 456)"/><ellipse cx="792" cy="396" rx="21" ry="9" transform="rotate(-30 792 396)"/>
              <ellipse cx="830" cy="338" rx="23" ry="10" transform="rotate(34 830 338)"/><ellipse cx="821" cy="267" rx="20" ry="9" transform="rotate(-25 821 267)"/>
            </g>
          </g>

          <g id="flowerLayer" class="growth-layer flower-layer" filter="url(#watercolor)">
            <g fill="#738fbd" stroke="#526a8f" stroke-width="3">
              <g transform="translate(342 525)"><circle r="9" fill="#e8d486"/><ellipse rx="8" ry="20" cy="-18"/><ellipse rx="8" ry="20" cy="18"/><ellipse rx="20" ry="8" cx="-18"/><ellipse rx="20" ry="8" cx="18"/></g>
              <g transform="translate(874 514) scale(.9)"><circle r="9" fill="#e8d486"/><ellipse rx="8" ry="20" cy="-18"/><ellipse rx="8" ry="20" cy="18"/><ellipse rx="20" ry="8" cx="-18"/><ellipse rx="20" ry="8" cx="18"/></g>
              <g transform="translate(978 539) scale(.7)"><circle r="9" fill="#e8d486"/><ellipse rx="8" ry="20" cy="-18"/><ellipse rx="8" ry="20" cy="18"/><ellipse rx="20" ry="8" cx="-18"/><ellipse rx="20" ry="8" cx="18"/></g>
            </g>
            <g fill="#d8a8bb" stroke="#a67589" stroke-width="3">
              <g transform="translate(438 442) scale(.7)"><circle r="9" fill="#e8d486"/><ellipse rx="8" ry="20" cy="-18"/><ellipse rx="8" ry="20" cy="18"/><ellipse rx="20" ry="8" cx="-18"/><ellipse rx="20" ry="8" cx="18"/></g>
              <g transform="translate(806 374) scale(.65)"><circle r="9" fill="#e8d486"/><ellipse rx="8" ry="20" cy="-18"/><ellipse rx="8" ry="20" cy="18"/><ellipse rx="20" ry="8" cx="-18"/><ellipse rx="20" ry="8" cx="18"/></g>
            </g>
          </g>

          <g id="potPlantLayer" class="growth-layer pot-plant-layer" transform="translate(920 438)" filter="url(#watercolor)">
            <path d="M0 5Q0-70 8-108" stroke="#4f7354" stroke-width="10" fill="none" stroke-linecap="round"/>
            <ellipse cx="-12" cy="-56" rx="28" ry="11" fill="#678a62" transform="rotate(25 -12 -56)"/>
            <ellipse cx="23" cy="-82" rx="26" ry="10" fill="#6d9165" transform="rotate(-25 23 -82)"/>
            <g transform="translate(10 -116) scale(.55)" fill="#8aa3c7"><circle r="10" fill="#e4d58d"/><ellipse rx="9" ry="22" cy="-20"/><ellipse rx="9" ry="22" cy="20"/><ellipse rx="22" ry="9" cx="-20"/><ellipse rx="22" ry="9" cx="20"/></g>
          </g>

          <g id="lightLayer" class="growth-layer light-layer">
            <circle cx="340" cy="345" r="120" fill="url(#lanternGlow)" filter="url(#softGlow)"/>
            <rect x="316" y="307" width="48" height="74" rx="16" fill="#ffe9a1" opacity=".8" filter="url(#softGlow)"/>
          </g>

          <g id="fireflyLayer" class="growth-layer firefly-layer" fill="#fff3a2" filter="url(#softGlow)">
            <circle class="firefly f1" cx="462" cy="408" r="5"/><circle class="firefly f2" cx="739" cy="465" r="5"/>
            <circle class="firefly f3" cx="896" cy="331" r="4"/><circle class="firefly f4" cx="584" cy="558" r="4"/>
            <circle class="firefly f5" cx="1010" cy="440" r="4"/><circle class="firefly f6" cx="276" cy="494" r="4"/>
          </g>
        </svg>
      <button id="openSettings" class="settings-fab" type="button" aria-label="Show settings">⚙</button>
    </div>
    <div class="progress-track" aria-hidden="true"><div id="progressFill" class="progress-fill"></div></div>
  </section>

  <aside id="settingsPanel" class="settings-panel">
    <div class="controls" aria-label="Timer controls">
      <button id="startButton" class="primary" type="button" aria-label="Start" title="Start">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5l11 7-11 7z" fill="currentColor" stroke="none"/></svg>
      </button>
      <button id="pauseButton" type="button" aria-label="Pause" title="Pause">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5v14M15 5v14"/></svg>
      </button>
      <button id="resetButton" class="reset-muted" type="button" aria-label="Reset" title="Reset">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.35-5.65L4 8.7M4 4v4.7h4.7"/></svg>
      </button>
    </div>

    <section class="setting-block duration-block">
      <div class="setting-heading"><label for="durationSlider">duration</label><output id="durationOutput">25 min</output></div>
      <input id="durationSlider" type="range" min="1" max="120" step="1" value="25">
      <div class="presets" aria-label="Duration presets">
        <button type="button" data-minutes="5">5</button><button type="button" data-minutes="15">15</button>
        <button type="button" class="active" data-minutes="25">25</button><button type="button" data-minutes="45">45</button>
        <button type="button" data-minutes="60">60</button><button type="button" data-minutes="90">90</button>
        <button type="button" data-minutes="120">120</button>
      </div>
    </section>

    <nav class="ritual-list" aria-label="Rituals">
      <button type="button" aria-disabled="true"><span class="icon-slot"><img src="assets/icons/bloom.svg?v=3" alt=""></span><span>bloom</span></button>
      <button type="button" aria-disabled="true"><span class="icon-slot"><img src="assets/icons/glow.svg?v=3" alt=""></span><span>glow</span></button>
      <button type="button" aria-disabled="true"><span class="icon-slot"><img src="assets/icons/flow.svg?v=3" alt=""></span><span>flow</span></button>
      <button type="button" aria-disabled="true"><span class="icon-slot"><img src="assets/icons/rise.svg?v=3" alt=""></span><span>rise</span></button>
      <button type="button" aria-disabled="true"><span class="icon-slot"><img src="assets/icons/read.svg?v=3" alt=""></span><span>read</span></button>
      <button type="button" aria-disabled="true"><span class="icon-slot"><img src="assets/icons/melt.svg?v=3" alt=""></span><span>melt</span></button>
      <button type="button" aria-disabled="true"><span class="icon-slot"><img src="assets/icons/fall.svg?v=3" alt=""></span><span>fall</span></button>
      <button type="button" aria-disabled="true"><span class="icon-slot"><img src="assets/icons/grow.svg?v=3" alt=""></span><span>grow</span></button>
      <button type="button" class="selected" aria-current="true"><span class="icon-slot"><img src="assets/icons/wonder.svg?v=3" alt=""></span><span>wonder</span></button>
    </nav>

    <div class="setting-row">
      <label for="soundSelect">finish sound</label>
      <select id="soundSelect">
        <option value="none">no sound</option>
        <option value="soft-chime" selected>soft chime</option>
        <option value="glass-bell">glass bell</option>
        <option value="singing-bowl">singing bowl</option>
        <option value="wind-chime">wind chime</option>
        <option value="wood-knock">wood knock</option>
        <option value="forest-bell">forest bell</option>
        <option value="gentle-piano">gentle piano</option>
      </select>
    </div>

    <div class="setting-row">
      <label for="hideSettings">hide settings</label>
      <input id="hideSettings" class="switch" type="checkbox">
    </div>
  </aside>
</main>
<script>

const $=s=>document.querySelector(s);
const app=$('.app'), visual=$('.visual');
const display=$('#timeDisplay'), progressFill=$('#progressFill'), slider=$('#durationSlider'), output=$('#durationOutput');
const startButton=$('#startButton'), pauseButton=$('#pauseButton'), resetButton=$('#resetButton');
const layers={moss:$('#mossLayer'),mushrooms:$('#mushroomLayer'),ferns:$('#fernLayer'),vines:$('#vineLayer'),flowers:$('#flowerLayer'),pot:$('#potPlantLayer'),light:$('#lightLayer'),fireflies:$('#fireflyLayer')};
let totalSeconds=25*60,remaining=totalSeconds,running=false,finished=false,startStamp=0,startRemaining=remaining,raf=0;
const clamp=(n,min=0,max=1)=>Math.min(max,Math.max(min,n));
const segment=(p,a,b)=>clamp((p-a)/(b-a));
function applyLayer(layer,amount,type='grow'){layer.style.opacity=String(amount);if(type==='moss')layer.style.transform=`scale(${.88+amount*.12})`;if(type==='grow')layer.style.transform=`translateY(${(1-amount)*16}px) scale(${.82+amount*.18})`;if(type==='vine')layer.style.transform=`scaleY(${.1+amount*.9})`;}
function renderGarden(progress){applyLayer(layers.moss,segment(progress,.04,.24),'moss');applyLayer(layers.mushrooms,segment(progress,.18,.35));applyLayer(layers.ferns,segment(progress,.28,.52));applyLayer(layers.vines,segment(progress,.45,.72),'vine');applyLayer(layers.flowers,segment(progress,.68,.88));applyLayer(layers.pot,segment(progress,.74,.93));layers.light.style.opacity=String(segment(progress,.95,1));layers.fireflies.style.opacity=String(segment(progress,.97,1));progressFill.style.width=`${progress*100}%`;}
function fmt(sec){sec=Math.max(0,Math.ceil(sec));return `${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`}
function updateControls(){startButton.classList.toggle('active',!running);pauseButton.classList.toggle('active',running);resetButton.classList.toggle('reset-muted',!finished&&remaining===totalSeconds);resetButton.classList.toggle('reset-ready',remaining<totalSeconds||finished);}
function updateDisplay(){display.textContent=fmt(remaining);renderGarden(totalSeconds?clamp(1-remaining/totalSeconds):0);updateControls();}
function setDuration(minutes){running=false;cancelAnimationFrame(raf);totalSeconds=minutes*60;remaining=totalSeconds;finished=false;visual.classList.add('idle');slider.value=minutes;output.value=`${minutes} min`;document.querySelectorAll('.presets button').forEach(b=>b.classList.toggle('active',+b.dataset.minutes===minutes));updateDisplay();}
function tick(now){if(!running)return;remaining=Math.max(0,startRemaining-(now-startStamp)/1000);updateDisplay();if(remaining<=0){finish();return}raf=requestAnimationFrame(tick)}
function start(){if(finished)setDuration(+slider.value);if(running)return;running=true;visual.classList.remove('idle');startRemaining=remaining;startStamp=performance.now();updateControls();raf=requestAnimationFrame(tick)}
function pause(){if(!running)return;running=false;cancelAnimationFrame(raf);visual.classList.add('idle');updateControls();}
function reset(){setDuration(+slider.value)}
function finish(){running=false;finished=true;remaining=0;renderGarden(1);display.textContent='00:00';visual.classList.add('idle');updateControls();playFinishSound($('#soundSelect').value)}
slider.addEventListener('input',()=>setDuration(+slider.value));document.querySelectorAll('.presets button').forEach(b=>b.addEventListener('click',()=>setDuration(+b.dataset.minutes)));
startButton.addEventListener('click',start);pauseButton.addEventListener('click',pause);resetButton.addEventListener('click',reset);
$('#hideSettings').addEventListener('change',e=>app.classList.toggle('settings-hidden',e.target.checked));$('#openSettings').addEventListener('click',()=>{app.classList.remove('settings-hidden');$('#hideSettings').checked=false});
let audioCtx;function tone(ctx,freq,start,dur,gain=.12,type='sine'){const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(freq,start);g.gain.setValueAtTime(0,start);g.gain.linearRampToValueAtTime(gain,start+.018);g.gain.exponentialRampToValueAtTime(.0001,start+dur);o.connect(g).connect(ctx.destination);o.start(start);o.stop(start+dur+.03)}
function playFinishSound(name){if(name==='none')return;audioCtx||=new(window.AudioContext||window.webkitAudioContext)();const c=audioCtx,t=c.currentTime+.03;const map={'soft-chime':()=>{tone(c,659,t,1.7,.10);tone(c,988,t+.08,1.8,.055)},'glass-bell':()=>{tone(c,1046,t,1.2,.09);tone(c,1568,t+.03,1,.04)},'singing-bowl':()=>{tone(c,220,t,2.8,.10);tone(c,440,t+.02,2.4,.035)},'wind-chime':()=>{[784,988,1175].forEach((f,i)=>tone(c,f,t+i*.16,1.4,.055))},'wood-knock':()=>{tone(c,150,t,.18,.17,'triangle');tone(c,110,t+.08,.2,.09,'triangle')},'forest-bell':()=>{tone(c,523,t,2.1,.08);tone(c,784,t+.12,1.8,.04)},'gentle-piano':()=>{[261.6,329.6,392].forEach((f,i)=>tone(c,f,t+i*.035,2.2,.045,'triangle'))}};(map[name]||map['soft-chime'])()}
setDuration(25);

</script>
